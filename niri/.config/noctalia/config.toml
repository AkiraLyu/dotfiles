[plugin_settings."noctalia/notes"]
panel_placement = "attached"

[plugin_settings."noctalia/screen_recorder"]
video_source = "focused"

[plugins]
enabled = [ "noctalia/screen_recorder" ]

[shell]
avatar_path = "/home/akira/Pictures/akiras/akira.jpg"
niri_overview_type_to_launch_enabled = true
screen_time_enabled = true

    [shell.launcher]
    app_grid = true

    [shell.panel]
    launcher_placement = "attached"

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "1"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "2"
    variant = "default"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "3"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "4"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "5"
    variant = "destructive"

    [[shell.session.actions]]
    action = "command"
    command = "systemctl hibernate"
    countdown_seconds = 0.0
    enabled = true
    glyph = "hibernate"
    label = "休眠"
    shortcut = "6"
    variant = "default"

[theme]
mode = "light"

[wallpaper]
enabled = false

    [wallpaper.default]
    path = "/home/akira/Pictures/Wallpapers/143650895_p0.png"

    [wallpaper.last]
    path = "/home/akira/Pictures/Wallpapers/143650895_p0.png"

    [wallpaper.monitors.eDP-1]
    path = "/home/akira/Pictures/Wallpapers/143650895_p0.png"

