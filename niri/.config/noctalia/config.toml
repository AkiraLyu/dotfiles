[bar.default]
background_opacity = 0.19999999552965164
center = [ "workspaces", "recorder" ]
font_family = "Noto Sans CJK SC"
margin_ends = 0
padding = 6
radius_top_left = 0
radius_top_right = 0
scale = 0.90000000596046448
shadow = false
start = [
    "launcher",
    "wallpaper",
    "theme_mode",
    "caffeine",
    "clock",
    "spacer-m",
    "cpu",
    "temp",
    "ram",
    "sysmon",
    "spacer_t",
    "active_window"
]
thickness = 22

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[dock]
concave_edge_corners = false
cross_axis_padding = 0
enabled = true
icon_size = 36
item_spacing = 0
launcher_position = "start"
main_axis_padding = 0
pinned = [ "firefox", "kitty", "org.kde.dolphin" ]
radius = 32
reserve_space = false
show_dots = true
smart_auto_hide = true

[location]
address = "ChengDu, China"

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [
    "lockscreen-login-box@eDP-1",
    "lockscreen-widget-0000000000000001",
    "lockscreen-widget-0000000000000002",
    "lockscreen-widget-0000000000000003"
]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 720.0
    cx = 768.0
    cy = 745.0
    output = "eDP-1"
    placement_height = 864.0
    placement_width = 1536.0
    rotation = 0.0
    type = "login_box"

