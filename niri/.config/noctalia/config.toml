max_length = 180
scroll_repeat = "gesture"
title_scroll = "on_hover"

    [widget.media.actions]
    back = "media next"
    forward = "media previous"
    scroll_down = "media next"
    scroll_up = "media previous"

[widget.network]
show_label = false

[widget.notes]
