monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "~alsa_output[.]platform-avs_hdaudio[.]4[.].*"
      },
      {
        node.name = "~alsa_output[.]pci-.*[.]analog-.*"
      },
      {
        node.name = "~alsa_output[.]usb-.*NICEHCK.*"
      }
    ]
    actions = {
      update-props = {
        audio.position = ["FR","FL"]
      }
    }
  }
]
