# Umbriel configuration (aligned with Niri & Noctalia IPC)
#
# Most changes apply when the file is saved. Check edits with:
#   umbriel config validate
#
# Complete reference: https://docs.noctalia.dev/umbriel/

[include]
files = [
    "configs/general.toml",
    "configs/outputs.toml",
    "configs/input.toml",
    "configs/appearance.toml",
    "configs/animation.toml",
    "configs/layout.toml",
    "configs/keybinds.toml",
    "configs/window-rules.toml",
    "configs/layer-rules.toml",
]

[include.optional]
files = ["noctalia.toml"]
