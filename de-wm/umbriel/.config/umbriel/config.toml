# Umbriel configuration (aligned with Niri & Noctalia IPC)
#
# Most changes apply when the file is saved. Check edits with:
#   umbriel config validate
#
# Complete reference: https://docs.noctalia.dev/umbriel/

# ==============================================================================
# Includes

[include]
files = []

[include.optional]
files = ["noctalia.toml"]

# ==============================================================================
# General & Environment

[general]
autostart = [
    "noctalia",
    "kwalletd6",
    "/usr/lib/pam_kwallet_init",
    "/home/akira/.config/niri/scripts/xconfig.sh",
]
xwayland = true
xwayland_native_resolution = true
xwayland_xsettings = true

[environment]
QT_QPA_PLATFORMTHEME = "kde"
XDG_MENU_PREFIX = "plasma-"

# ==============================================================================
# Outputs (from niri screen.kdl)

[output.eDP-1]
mode = "1920x1080@60.000"
position = [0, 0]
scale = 1.25
transform = "normal"

[output.stream]
scale = 2.0

[output.HDMI-A-1]
enabled = false

# ==============================================================================
# Appearance (from niri layout.kdl, layer.kdl, windowrule.kdl, noctalia.kdl)

[appearance]
prefer_no_csd = true
border_width = 2
corner_radius = 12

[appearance.blur]
enabled = true
optimized = false
passes = 1
radius = 3
noise = 0.03
brightness = 1.0
contrast = 1.0
saturation = 2.0

[appearance.shadow]
enabled = true
softness = 30
offset_x = 0
offset_y = 5

# Niri does not draw server-side title bars; kept off to match Niri.
# Switch mode to "on" if you want macOS-style title bars in Umbriel.
[appearance.title_bar]
mode = "off"
height = 28
font = "sans 10"
title_align = "right"
button_position = "left"
buttons = ["minimize", "maximize", "close"]
button_size = -1
button_gap = 8
button_padding = -1
button_corner_radius = -1
button_glyph = "hover"
button_glyph_size = -1
button_glyph_stroke = -1
button_background = true

# ==============================================================================
# Overview & Colors (fallback when noctalia.toml template is not active)

[overview]
zoom = 0.6
background_blur = true
workspace_wallpaper = true

[colors]
accent_primary = "#5058b1ff"
error = "#a53c59ff"
insert_hint = "#5058b180"
shadow = "#00000077"

[colors.border]
focused = "#5058b1ff"
unfocused = "#dcddeaff"

[colors.tab_bar]
active = "#5058b1ff"
active_unfocused = "#b2b5d8ff"
urgent = "#a53c59ff"

[colors.overview]
badge = "#5058b1ff"
background_tint = "#77777780"

[colors.title_bar]
background = "#F4F5FA4D"
background_unfocused = "#E4E5EF4D"
text = "#1E1F2BFF"
text_unfocused = "#6B6D80FF"
close = "#F25C66FF"
close_glyph = "#2A0B0EFF"
close_glyph_hover = "#2A0B0EFF"
maximize = "#5B8AF5FF"
maximize_glyph = "#0E1C3BFF"
maximize_glyph_hover = "#0E1C3BFF"
minimize = "#F5B82EFF"
minimize_glyph = "#332200FF"
minimize_glyph_hover = "#332200FF"

# ==============================================================================
# Input (from niri input.kdl & env.kdl)

[input.keyboard]
numlock_toggle = true

[input.cursor]
theme = "breeze_cursors"
size = 18
hide_when_typing = true
hide_timeout_ms = 1000

[input.touchpad]
tap = true
natural_scroll = true

# ==============================================================================
# Layout (from niri layout.kdl)

[layout]
mode = "scrolling"
gap = 6
extent_presets = [0.33333, 0.5, 0.66667]

[layout.scrolling]
center_focused = "never"
default_extent_fraction = 0.5

# ==============================================================================
# Keybinds (aligned with niri keys.kdl & recent.kdl, using Noctalia IPC)

[keybinds]
# System, overview & session
"Mod+Shift+Slash" = { action = "cheatsheet-toggle", repeat = false }
"Mod+C" = { action = "window-close", repeat = false }
"Mod+M" = "session-quit"
"Mod+O" = { action = "overview-toggle", repeat = false }
"Mod+Shift+P" = { action = "spawn noctalia msg dpms-off", repeat = false }
"Mod+Escape" = { action = "shortcuts-inhibit-toggle", allow_when_inhibited = true, repeat = false }

# Screenshots (Noctalia IPC)
"Print" = { action = "spawn noctalia msg screenshot-region", repeat = false }
"Mod+Print" = { action = "spawn noctalia msg screenshot-fullscreen", repeat = false }
"Alt+Print" = { action = "spawn noctalia msg screenshot-window", repeat = false }

# Applications & Noctalia UI (Noctalia IPC)
"Mod+Period" = { action = "spawn noctalia msg panel-toggle launcher /emo", repeat = false }
"Mod+Q" = { action = "spawn kitty", repeat = false }
"Mod+E" = { action = "spawn dolphin ~", repeat = false }
"Mod+R" = { action = "spawn noctalia msg panel-toggle launcher", repeat = false }
"Mod+Shift+T" = { action = "spawn noctalia msg theme-mode-toggle", repeat = false }
"Mod+Shift+V" = { action = "spawn noctalia msg panel-toggle clipboard", repeat = false }
"Alt+L" = { action = "spawn noctalia msg brightness-set 0", repeat = false }
"Alt+W" = { action = "spawn noctalia msg brightness-set 50%", repeat = false }
"Mod+P" = { action = "spawn sh -c 'c=$(hyprpicker -a); [ -n \"$c\" ] && noctalia msg notification-show \"Color Picked\" \"$c\"'", repeat = false }
"Mod+Space" = { action = "spawn noctalia msg panel-toggle session", repeat = false }
"Mod+Shift+Space" = { action = "spawn noctalia msg panel-toggle launcher", repeat = false }
"Mod+D" = { action = "spawn noctalia msg dock-toggle", repeat = false }
"Mod+S" = { action = "spawn noctalia msg panel-toggle control-center", repeat = false }

# Recent windows switcher (Noctalia IPC)
"Alt+Tab" = "spawn noctalia msg window-switcher hold"
"Alt+Shift+Tab" = "spawn noctalia msg window-switcher hold reverse"
"Mod+Tab" = "spawn noctalia msg window-switcher hold"
"Mod+Shift+Tab" = "spawn noctalia msg window-switcher hold reverse"

# Media, volume & brightness (Noctalia IPC)
"XF86AudioRaiseVolume" = { action = "spawn noctalia msg volume-up 10", allow_when_locked = true }
"XF86AudioLowerVolume" = { action = "spawn noctalia msg volume-down 10", allow_when_locked = true }
"XF86AudioMute" = { action = "spawn noctalia msg volume-mute", allow_when_locked = true, repeat = false }
"XF86AudioMicMute" = { action = "spawn noctalia msg mic-mute", allow_when_locked = true, repeat = false }
"XF86AudioPlay" = { action = "spawn noctalia msg media toggle", allow_when_locked = true, repeat = false }
"XF86AudioNext" = { action = "spawn noctalia msg media next", allow_when_locked = true }
"XF86AudioPrev" = { action = "spawn noctalia msg media previous", allow_when_locked = true }
"XF86MonBrightnessDown" = { action = "spawn noctalia msg brightness-down current 5%", allow_when_locked = true }
"XF86MonBrightnessUp" = { action = "spawn noctalia msg brightness-up current 5%", allow_when_locked = true }

# Window state & sizing
"Mod+V" = { action = "window-toggle-floating", repeat = false }
"Mod+F" = { action = "window-toggle-maximize", repeat = false }
"Mod+Ctrl+V" = { action = "window-focus-switch-floating", repeat = false }
"Mod+Shift+R" = "window-cycle-secondary-extent"
"Mod+Ctrl+R" = "window-set-secondary-extent 1.0"
"Mod+Shift+F" = { action = "window-toggle-maximize-to-edges", repeat = false }
"Alt+Shift+F" = { action = "window-toggle-fullscreen", repeat = false }
"Mod+Ctrl+F" = { action = "window-set-primary-extent 1.0", repeat = false }
"Mod+Alt+R" = "window-cycle-primary-extent"
"Mod+Alt+C" = "column-center"
"Mod+Ctrl+C" = "column-center"
"Mod+Minus" = "window-modify-primary-extent -0.10"
"Mod+Equal" = "window-modify-primary-extent +0.10"
"Mod+Shift+Minus" = "window-modify-secondary-extent -0.10"
"Mod+Shift+Equal" = "window-modify-secondary-extent +0.10"
"Mod+BracketLeft" = "window-consume-or-expel-left"
"Mod+BracketRight" = "window-consume-or-expel-right"
"Mod+Comma" = "window-consume-from-right"
"Mod+W" = { action = "column-toggle-tabbed", repeat = false }

# Window focus
"Mod+Left" = "window-focus-left"
"Mod+Down" = "window-focus-down"
"Mod+Up" = "window-focus-up"
"Mod+Right" = "window-focus-right"
"Mod+H" = "window-focus-left"
"Mod+J" = "window-focus-down"
"Mod+K" = "window-focus-up"
"Mod+L" = "window-focus-right"
"Mod+Home" = "column-focus-first"
"Mod+End" = "column-focus-last"
"Mod+WheelRight" = "window-focus-right"
"Mod+WheelLeft" = "window-focus-left"

# Window movement
"Mod+Shift+Left" = "column-move-left"
"Mod+Shift+Down" = "window-move-down"
"Mod+Shift+Up" = "window-move-up"
"Mod+Shift+Right" = "column-move-right"
"Mod+Shift+H" = "column-move-left"
"Mod+Shift+J" = "window-move-down"
"Mod+Shift+K" = "window-move-up"
"Mod+Shift+L" = "column-move-right"
"Mod+Shift+WheelDown" = "column-move-right"
"Mod+Shift+WheelUp" = "column-move-left"

# Monitor (output) focus
"Mod+Ctrl+Left" = "output-focus-left"
"Mod+Ctrl+Down" = "output-focus-down"
"Mod+Ctrl+Up" = "output-focus-up"
"Mod+Ctrl+Right" = "output-focus-right"
"Mod+Ctrl+H" = "output-focus-left"
"Mod+Ctrl+J" = "output-focus-down"
"Mod+Ctrl+K" = "output-focus-up"
"Mod+Ctrl+L" = "output-focus-right"
"Mod+Ctrl+Page_Down" = "output-focus-down"
"Mod+Ctrl+Page_Up" = "output-focus-up"
"Mod+Ctrl+U" = "output-focus-down"
"Mod+Ctrl+I" = "output-focus-up"
"Mod+Ctrl+WheelDown" = { action = "output-focus-down", cooldown_ms = 150 }
"Mod+Ctrl+WheelUp" = { action = "output-focus-up", cooldown_ms = 150 }

# Monitor (output) movement
"Mod+Shift+Ctrl+Left" = "column-move-to-output-left"
"Mod+Shift+Ctrl+Down" = "column-move-to-output-down"
"Mod+Shift+Ctrl+Up" = "column-move-to-output-up"
"Mod+Shift+Ctrl+Right" = "column-move-to-output-right"
"Mod+Shift+Ctrl+H" = "column-move-to-output-left"
"Mod+Shift+Ctrl+J" = "column-move-to-output-down"
"Mod+Shift+Ctrl+K" = "column-move-to-output-up"
"Mod+Shift+Ctrl+L" = "column-move-to-output-right"

# Workspace focus
"Mod+Page_Down" = "workspace-next"
"Mod+Page_Up" = "workspace-previous"
"Mod+U" = "workspace-next"
"Mod+I" = "workspace-previous"
"Mod+WheelDown" = { action = "workspace-next", cooldown_ms = 150 }
"Mod+WheelUp" = { action = "workspace-previous", cooldown_ms = 150 }
"Mod+1" = "workspace-switch 1"
"Mod+2" = "workspace-switch 2"
"Mod+3" = "workspace-switch 3"
"Mod+4" = "workspace-switch 4"
"Mod+5" = "workspace-switch 5"
"Mod+6" = "workspace-switch 6"
"Mod+7" = "workspace-switch 7"
"Mod+8" = "workspace-switch 8"
"Mod+9" = "workspace-switch 9"

# Workspace movement
"Mod+Alt+Down" = "workspace-move-down"
"Mod+Alt+Up" = "workspace-move-up"
"Mod+Shift+1" = "column-move-to-workspace 1"
"Mod+Shift+2" = "column-move-to-workspace 2"
"Mod+Shift+3" = "column-move-to-workspace 3"
"Mod+Shift+4" = "column-move-to-workspace 4"
"Mod+Shift+5" = "column-move-to-workspace 5"
"Mod+Shift+6" = "column-move-to-workspace 6"
"Mod+Shift+7" = "column-move-to-workspace 7"
"Mod+Shift+8" = "column-move-to-workspace 8"
"Mod+Shift+9" = "column-move-to-workspace 9"
"Mod+Shift+U" = "column-move-to-workspace-next"
"Mod+Shift+I" = "column-move-to-workspace-previous"

# ==============================================================================
# Window rules (from niri float.kdl, layer.kdl, windowrule.kdl + Noctalia)

# Global blur without xray (blur overlapping windows behind)
[[window_rule]]
blur = true
blur_optimized = false

# Noctalia built-in rules
[[window_rule]]
match.app_id = "^dev\\.noctalia\\.Noctalia$"
default_floating = true
default_floating_size_px = { width = 1020, height = 900 }

[[window_rule]]
match.app_id = "^dev\\.noctalia\\.UmbrielSharePicker$"
default_floating = true
default_floating_size_px = { width = 800, height = 600 }

[[window_rule]]
match.title = "^notificationtoasts_.+_desktop"
default_position = { x = 0, y = 0, anchor = "bottom_right" }
default_focused = false
default_pinned = true

# Floating apps (from float.kdl)
[[window_rule]]
match.app_id = [
    '^wpsoffice$',
    '^wps$',
    '^wpspdf$',
    '^et$',
    '^wpp$',
    '.*\.exe$',
    "steam_proton",
    "Display",
    'org\.kde\.kdenlive',
    'org\.kde\.gwenview',
]
default_floating = true

[[window_rule]]
match.title = "plasmashell"
default_floating = true

# WeChat fix
[[window_rule]]
match.app_id = 'wechat$'
default_floating = true
default_focused = false

# Floating with fixed sizes (from float.kdl)
[[window_rule]]
match.app_id = 'org\.gnome\.Calendar'
default_floating = true
default_floating_size_px = { width = 1200, height = 700 }

[[window_rule]]
match.app_id = 'org\.kde\.dolphin'
default_floating = true
default_floating_size_px = { width = 885, height = 620 }

[[window_rule]]
match.app_id = 'org\.freedesktop\.impl\.portal\.desktop\.kde'
default_floating = true
default_floating_size_px = { width = 950, height = 580 }

[[window_rule]]
match.title = "QQ"
default_floating = true
default_floating_size_px = { width = 940, height = 660 }

[[window_rule]]
match.app_id = "Typora"
match.title = "License Info"
default_floating = true

[[window_rule]]
match.app_id = "kitty"
default_floating = true
default_floating_size_px = { width = 973, height = 627 }
blur = true
blur_optimized = false

[[window_rule]]
match.app_id = 'org\.telegram\.desktop'
default_floating = true
default_floating_size_px = { width = 788, height = 610 }

[[window_rule]]
match.app_id = "SPlayer"
opacity = 0.8
default_floating = true
default_floating_size_px = { width = 1055, height = 655 }

[[window_rule]]
match.app_id = 'org\.mozilla\.Thunderbird'
default_scrolling_extent_px = 1032

[[window_rule]]
match.app_id = 'org\.waywallen\.waywallen'
default_floating = true
default_floating_size_px = { width = 940, height = 710 }

# Display & maximization rules (from windowrule.kdl)
[[window_rule]]
match.app_id = "firefox"
default_maximize_to_edges = true

[[window_rule]]
match.app_id = "code"
default_maximize = true

# Keep Firefox sub-windows floating instead of maximized-to-edges
[[window_rule]]
match.app_id = "firefox"
match.title = "^(我的足迹|Library)$"
default_floating = true
default_maximize = false
default_maximize_to_edges = false

[[window_rule]]
match.title = "^(Picture-in-Picture|Picture in picture)$"
default_floating = true
default_maximize = false
default_maximize_to_edges = false
default_position = { x = 20, y = 20, anchor = "bottom_right" }

[[window_rule]]
match.app_id = "Codex"
blur = false
shadow = false

[[window_rule]]
match.app_id = "netease-cloud-music-web-player"
default_scrolling_extent_px = 1100

[[window_rule]]
match.app_id = 'md\.obsidian\.Obsidian'
opacity = 0.999

# ==============================================================================
# Layer rules (Noctalia blur)

[[layer_rule]]
match.namespace = "^noctalia-(bar-[^\"]+|notification|dock|panel|attached-panel|osd|desktop-widget-[^\"]*)$"
blur = true
blur_ignore_alpha = 0.2
blur_popups = true

[[layer_rule]]
match.namespace = "^noctalia-(notification|dock|panel|attached-panel|osd)$"
blur_optimized = false

# ==============================================================================
# Hot corners

[hot_corners.top_left]
enabled = true
delay_ms = 100
action = "overview-open"
