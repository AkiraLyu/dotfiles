# General & Environment

[general]
autostart = [
    "noctalia",
    "kwalletd6",
    "/usr/lib/pam_kwallet_init",
    "$HOME/.config/umbriel/scripts/xconfig.sh",
]
xwayland = true
xwayland_native_resolution = true
xwayland_xsettings = true

[environment]
QT_QPA_PLATFORMTHEME = "kde"
XDG_MENU_PREFIX = "plasma-"

[[security_context_rule]]
match.app_id = 'com\.tencent\.wechat'
allow_globals = ["zxdg_output_manager_v1"]
