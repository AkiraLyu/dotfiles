[opener]
play = [
    { run = 'mpv %s', orphan = true, for = "unix" },
]

edit = [
    { run = '$EDITOR %s', block = true, for = "unix" },
]

pic = [
    { run = 'gwenview %s', block = true, for = "unix" },
]

epub = [
    { run = 'foliate %s', block = true, for = "unix" },
]

open = [
    { run = 'xdg-open %s1', desc = "Open", for = "linux" },
]

pdf = [
    { run = 'zathura %s', block = true, for = "unix" },
]

[open]
prepend_rules = [
    # JSON
    { mime = "application/json", use = "edit" },

    # EPUB
    { mime = "application/epub+zip", use = "epub" },

    # HTML
    { mime = "text/html", use = ["open", "edit"] },

    # Images
    { mime = "image/png",  use = "pic" },
    { mime = "image/jpeg", use = "pic" },

    # PDF
    { mime = "application/pdf", use = "pdf" },
]
